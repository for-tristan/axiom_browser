# =============================================================================
#  Patched gradle.properties for axiom_browser
#  Fixes the Kotlin daemon "Storage already registered" build error.
#  Replace your existing android/gradle.properties with this file.
# =============================================================================

# --- JVM memory for the Gradle daemon ---------------------------------------
# Original was -Xmx8G which is excessive and makes the daemon hold many
# file handles at once. 4G is plenty for a Flutter app of this size.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# --- AndroidX ---------------------------------------------------------------
android.useAndroidX=true

# --- Flutter template flags (keep as-is) ------------------------------------
android.newDsl=false
android.builtInKotlin=false

# === FIXES FOR THE KOTLIN DAEMON CACHE ERROR ================================

# 1. Run Kotlin compilation in-process (no separate daemon).
#    This eliminates the cross-daemon "Storage already registered" bug
#    entirely, at the cost of slightly slower first builds.
#    Once your builds are stable you can comment this line out to
#    re-enable the daemon for speed.
kotlin.compiler.execution.strategy=in-process

# 2. Disable Kotlin incremental compilation.
#    The error is in the incremental cache (.tab files). Turning off
#    incremental compilation makes the issue impossible to reproduce.
#    Comment out to re-enable once builds are stable.
kotlin.incremental=false

# 3. Don't keep the Gradle daemon alive between builds (smaller chance
#    of stale state). Comment out if you want faster incremental builds
#    once everything is stable.
org.gradle.daemon=false

# 4. Parallel builds + caching (safe defaults).
org.gradle.parallel=true
org.gradle.caching=true

# 5. Workaround for very long Windows paths in the build folder.
#    Forces Gradle to use a shorter temporary directory.
org.gradle.native.dir=../build/.native

# 6. Quiet down the Kotlin daemon log spam.
kotlin.daemon.jvmargs=-Xmx2G
